# Deploy STAGING ke Cloudflare Workers (https://rilisin.dikanjut.workers.dev), manual.
# Rahasia ada di environment "staging" (dibatasi ke branch main): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# dan RILISIN_STAGING_ENV (JSON env runtime Worker). DB = DB staging yang sama dengan Vercel (data demo, bayar mock).
name: Cloudflare deploy staging

on:
  workflow_dispatch:
    inputs:
      cpu_ms:
        description: "Batas CPU per request untuk uji (10 = simulasi Workers Free). Kosong = default akun."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cf-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy Worker staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_ENV: ${{ secrets.RILISIN_STAGING_ENV }}
      CPU_LIMIT_MS: ${{ inputs.cpu_ms }}
      NEXT_PUBLIC_ONESIGNAL_APP_ID: 2679dd2e-12a3-4274-a1c2-eecc75b99a0b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Env build dari bundel staging (di-mask)
        run: |
          node -e '
            const fs = require("fs");
            const b = JSON.parse(process.env.STAGING_ENV);
            let out = "";
            for (const [k, v] of Object.entries(b)) {
              if (v.length >= 8) console.log("::add-mask::" + v);
              out += `${k}<<__EOF__\n${v}\n__EOF__\n`;
            }
            fs.appendFileSync(process.env.GITHUB_ENV, out);
            console.log("kunci env:", Object.keys(b).sort().join(", "));
          '
      - name: Persiapan Workers (buang /api/og) + config staging
        run: |
          node scripts/cloudflare/prepare.mjs
          node scripts/cloudflare/staging-config.mjs
      - name: OpenNext build
        run: npx opennextjs-cloudflare build 2>&1 | tail -n 40
      - name: Diagnosis bundel (postgres entry)
        run: |
          h=.open-next/server-functions/default/handler.mjs
          echo "cloudflare:sockets: $(grep -o 'cloudflare:sockets' $h | wc -l)"
          echo "rejectUnauthorized: $(grep -o 'rejectUnauthorized' $h | wc -l)"
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.staging.json 2>&1 | tee deploy.log | tail -n 30
      - name: Set secret runtime
        run: |
          printf '%s' "$STAGING_ENV" > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json" --config wrangler.staging.json 2>&1 | tail -n 8
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Cek HTTP (Basic auth SITE_LOCK)
        run: |
          sleep 8
          base=https://rilisin.dikanjut.workers.dev
          npx wrangler tail --config wrangler.staging.json --format json > tail.log 2>&1 &
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/")
          echo "tanpa auth: / -> $code (harus 401 karena situs dikunci)"
          fail=0
          for p in / /jelajahi /masuk /forum /komunitas /ketentuan /p/kasirku-offline; do
            c=$(curl -s -o /tmp/body -w "%{http_code}" -u "$SITE_LOCK_USER:$SITE_LOCK_PASSWORD" "$base$p")
            echo "GET $p -> $c"
            [ "$c" = "200" ] || { fail=1; head -c 300 /tmp/body; echo; }
          done
          echo "--- sampel hangat: 15x per halaman"
          for p in "/api/cf-probe?m=none" "/api/cf-probe?m=db" "/api/cf-probe?m=db3" /masuk /ketentuan; do
            codes=""
            for i in $(seq 1 15); do
              codes="$codes $(curl -s -o /dev/null -w '%{http_code}' -u "$SITE_LOCK_USER:$SITE_LOCK_PASSWORD" "$base$p")"
            done
            echo "$p:$codes"
          done
          sleep 6
          echo "--- statistik CPU dari wrangler tail"
          python3 - <<'PY'
          import json, statistics
          txt = open("tail.log").read()
          dec = json.JSONDecoder(); i = 0; ev = []
          while True:
              i = txt.find("{", i)
              if i < 0: break
              try:
                  obj, end = dec.raw_decode(txt, i)
              except Exception:
                  i += 1; continue
              i = end
              if isinstance(obj, dict) and "cpuTime" in obj:
                  ev.append(obj)
          def path(e):
              return (e.get("event") or {}).get("request", {}).get("url", "").split(".dev", 1)[-1]
          by = {}
          for e in ev:
              by.setdefault(path(e) or "?", []).append(e)
          print("total event:", len(ev), "| outcome:", {o: sum(1 for e in ev if e.get("outcome") == o) for o in {e.get("outcome") for e in ev}})
          for p, es in sorted(by.items()):
              cpu = sorted(e["cpuTime"] for e in es)
              st = sorted(e["wallTime"] for e in es)
              q = lambda a, f: a[min(len(a) - 1, int(f * len(a)))]
              print(f"{p[:28]:28} n={len(es):3} cpu_ms min={cpu[0]} p50={q(cpu,.5)} p90={q(cpu,.9)} max={cpu[-1]} | wall p50={q(st,.5)}")
          bad = [e for e in ev if e.get("outcome") not in ("ok",)]
          for e in bad[:5]:
              print("non-ok:", e.get("outcome"), path(e), [x.get("message", "")[:120] for x in e.get("exceptions", [])][:1])
          PY
          exit $fail
