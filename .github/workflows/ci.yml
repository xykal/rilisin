# CI Rilisin: lint → typecheck → seed DB → build → smoke test end-to-end (143 cek) → contract test Pakasir v2.
# Job test tanpa secret apa pun (APP_SECRET dibuat acak per run, pembayaran mode simulasi, gateway palsu).
# Job deploy: push ke main yang LULUS test -> deploy staging ke Vercel (build di Vercel, env tetap di Vercel).
# Job deploy-prod: MANUAL (workflow_dispatch) -> deploy produksi ke proyek Vercel terpisah (butuh environment 'production', lihat docs/CUTOVER.md).
# Token = secret environment "staging" yang dibatasi ke branch main; PR & Dependabot tidak bisa membacanya.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rilisin
          POSTGRES_PASSWORD: rilisin
          POSTGRES_DB: rilisin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rilisin -d rilisin"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://rilisin:rilisin@localhost:5432/rilisin
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: .local/storage
      PAYMENT_PROVIDER: mock
      REQUIRE_STAFF_2FA: "0"
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      # Kunci UJI resmi Cloudflare Turnstile (publik, selalu lolos dengan token dummy) — mode ketat
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # Login Google: kredensial & endpoint UJI (server OAuth palsu di bawah, bukan Google sungguhan).
      # Nilai ini hanya ada di CI — kredensial produksi disimpan sebagai secret environment.
      GOOGLE_CLIENT_ID: uji-ci-rilisin.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: rahasia-uji-ci-bukan-produksi
      GOOGLE_AUTH_URL: http://localhost:9090/auth
      GOOGLE_TOKEN_URL: http://localhost:9090/token
      GOOGLE_USERINFO_URL: http://localhost:9090/userinfo
      FAKE_GOOGLE_PORT: "9090"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Rahasia acak (khusus run ini)
        run: |
          for name in APP_SECRET CRON_SECRET SCAN_WORKER_TOKEN; do
            s=$(node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))")
            echo "::add-mask::$s"
            echo "$name=$s" >> "$GITHUB_ENV"
          done
          # Kunci publik backup (kunci privat run ini dibuang — uji restore memakai pasangan kuncinya sendiri)
          pub=$(node -e "const {generateKeyPairSync}=require('crypto');console.log(generateKeyPairSync('x25519').publicKey.export({format:'der',type:'spki'}).toString('base64'))")
          echo "BACKUP_PUBLIC_KEY=$pub" >> "$GITHUB_ENV"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      - name: Dokumen hukum sinkron (docs/legal ↔ src/content/legal)
        run: npm run legal:check
      - name: Migrasi + data demo
        run: npx tsx scripts/seed.ts
      - name: Uji backup & restore (enkripsi, pulih, cocokkan data)
        run: npx tsx scripts/test-backup.ts
      - name: "Build (jalur deploy Vercel: migrate + build)"
        run: npm run vercel-build
      # Server OAuth Google PALSU: dipakai tes login Google end-to-end (PKCE, state, penolakan).
      # Tidak ada kredensial Google sungguhan di CI — kalau tidak, token bisa terpakai orang lain.
      - name: Google OAuth palsu (untuk tes login Google)
        run: |
          node tests/security/fake-google.mjs > fake-google.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:9090/__state && exit 0; sleep 1; done
          echo "server Google palsu tidak menyala"; cat fake-google.log; exit 1
      - name: Jalankan server
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          echo "server tidak menyala"; cat server.log; exit 1
      - name: Smoke test end-to-end
        run: node scripts/smoke-test.mjs
      - name: Security proving tests (429, injeksi, IDOR, CSRF, batas auth)
        run: npm run test:security
      - name: Contract test Pakasir v2
        run: npm run test:pakasir
      # DAST: ZAP baseline = spider + scan pasif ke server uji (TANPA serangan
      # aktif — tidak ada fuzzing yang mengubah data). Image di-pin by digest
      # (stable per 2026-09-29, diverifikasi via ghcr API). Kebijakan
      # (scripts/qa/zap-baseline-check.mjs): temuan HIGH = gagal; Medium ke
      # bawah dilaporkan tapi tidak menggagalkan (aturan generik scan pasif
      # tidak paham pola origin + fetch-metadata kita → banyak false positive).
      - name: ZAP baseline (DAST)
        run: |
          # Container ZAP jalan sebagai user non-root → direktori laporan khusus
          # yang bisa ditulis siapa pun (repo checkout milik user runner).
          mkdir -p zap-out && chmod 777 zap-out
          code=0
          docker run --rm --network host -v "$(pwd)/zap-out:/zap/wrk:rw" \
            "ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef" \
            zap-baseline.py -t http://localhost:3000 -m 2 -J zap-baseline.json -r zap-baseline.html || code=$?
          if [ "$code" -gt 2 ]; then echo "ZAP error (exit $code)"; exit 1; fi
          node scripts/qa/zap-baseline-check.mjs zap-out/zap-baseline.json
      - name: Log server (kalau gagal)
        if: failure()
        run: |
          tail -n 200 server.log || true
          echo "--- log Google palsu ---"
          tail -n 50 fake-google.log || true

  security:
    name: Security scan (dependency)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # npm audit membaca package-lock.json langsung (tanpa install): gagal kalau
      # ada advisory high/critical — termasuk devDependencies yang jalan di CI.
      - name: Audit dependency (high/critical = gagal)
        run: npm audit --audit-level=high

  deploy:
    name: Deploy staging (Vercel)
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://rilisin.xyverse.my.id
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Deploy ke Vercel (production = staging terkunci)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@60.1.3 deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-prod:
    name: Deploy PRODUKSI (Vercel, manual)
    needs: [test, security]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_PROD_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROD_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Cek prasyarat proyek produksi
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Belum dikonfigurasi: isi vars VERCEL_PROD_ORG_ID + VERCEL_PROD_PROJECT_ID dan secrets VERCEL_TOKEN di environment 'production' (lihat docs/CUTOVER.md Fase 1).";
            exit 1;
          fi
      - name: Deploy ke Vercel (PRODUKSI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@60.1.3 deploy --prod --yes --token "$VERCEL_TOKEN"
